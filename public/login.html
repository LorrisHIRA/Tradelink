<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeLink - Log in</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header><a class="brand" href="/search.html">TradeLink</a> <small>Get found by clients near you. Free.</small></header>
  <main>
    <div class="card">
      <h2>Log in</h2>
      <form id="loginForm" novalidate>
        <label for="phoneNumber">Phone number</label>
        <input id="phoneNumber" type="tel" placeholder="0788123456" autocomplete="tel">

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">

        <div class="error" id="err-general"></div>
        <button type="submit">Log in</button>
      </form>
      <p class="switch">New here? <a href="/register.html">Create an account</a></p>
      <p class="switch"><a href="/search.html">Looking for a tradesperson? Search here</a></p>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await api('/auth/login', 'POST', {
          phoneNumber: document.getElementById('phoneNumber').value,
          password: document.getElementById('password').value,
        });
        saveSession(data.token, data.fullName, data.role);
        window.location.href = data.role === 'admin' ? '/admin.html' : '/profile.html';
      } catch (err) { showError(err); }
    });
  </script>
</body>
</html>
